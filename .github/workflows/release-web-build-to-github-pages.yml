name: ReleaseWebBuildToGithubPages

on:
  release:
    types:
      - published

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build versioned web release
    runs-on: ubuntu-latest
    env:
      WEB_ASSET_NAME: babylon-web-build.zip
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${{ github.event.release.tag_name }}"
          version_pattern='^v[0-9]+[.][0-9]+[.][0-9]+$'
          if ! [[ "${release_version}" =~ ${version_pattern} ]]; then
            echo "::error::Release tag must look like v0.0.0."
            exit 1
          fi
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          printf '{\n  "releaseVersion": "%s",\n  "downloadSize": "000000000000"\n}\n' \
            "${release_version}" \
            > Babylon/public/environment.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        working-directory: Babylon
        run: npm run check

      - name: Run unit tests
        working-directory: Babylon
        run: npm run run_unit_tests

      - name: Build browser app
        working-directory: Babylon
        run: npm run build

      - name: Record total browser download size
        shell: bash
        run: |
          set -euo pipefail
          artifact_size="$(find Babylon/dist -type f -printf '%s\n' | \
            awk '{ total += $1 } END { print total }')"
          if ! [[ "${artifact_size}" =~ ^[0-9]{1,12}$ ]]; then
            echo "::error::Artifact size is outside the metadata field width."
            exit 1
          fi
          padded_size="$(printf '%012d' "${artifact_size}")"
          sed -i -E \
            "s/\"downloadSize\": \"[0-9]+\"/\"downloadSize\": \"${padded_size}\"/" \
            Babylon/dist/environment.json
          final_size="$(find Babylon/dist -type f -printf '%s\n' | \
            awk '{ total += $1 } END { print total }')"
          test "${final_size}" = "${artifact_size}"

      - name: Validate browser build
        shell: bash
        run: |
          set -euo pipefail
          test -f Babylon/dist/index.html
          test -f Babylon/dist/environment.json
          grep -Eq '"downloadSize": "[0-9]{12}"' \
            Babylon/dist/environment.json
          test -f Babylon/dist/HavokPhysics.wasm
          test -f Babylon/dist/assets/audio/sfx/rotate.wav
          test -f Babylon/dist/assets/audio/sfx/levelup.wav
          test -f Babylon/dist/assets/images/inventory/apple.png
          test -f Babylon/dist/assets/models/tree/MapleTree_4.gltf

      - name: Package release web build
        shell: bash
        run: |
          set -euo pipefail
          cd Babylon/dist
          zip -q -r "../../${WEB_ASSET_NAME}" .

      - name: Store web build on the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_names="$(
            gh release view "${RELEASE_VERSION}" \
              --json assets \
              --jq '.assets[].name'
          )"
          if printf '%s\n' "${asset_names}" | \
            grep -Fxq "${WEB_ASSET_NAME}"; then
            echo "Release web build already exists; keeping it immutable."
          else
            gh release upload \
              "${RELEASE_VERSION}" \
              "${WEB_ASSET_NAME}"
          fi

      - name: Assemble all versioned Pages builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pages-store/releases
          version_pattern='^v[0-9]+([.][0-9]+){1,2}'
          version_pattern+='(-[0-9A-Za-z.-]+)?$'
          releases_api="repos/${GITHUB_REPOSITORY}/releases"

          while IFS= read -r release_version; do
            if ! [[ "${release_version}" =~ ${version_pattern} ]]; then
              echo "Skipping unsupported tag ${release_version}."
              continue
            fi

            release_tmp="${RUNNER_TEMP}/releases/${release_version}"
            mkdir -p "${release_tmp}"
            if gh release download "${release_version}" \
              --pattern "${WEB_ASSET_NAME}" \
              --dir "${release_tmp}"; then
              release_dir="pages-store/releases/${release_version}"
              mkdir -p "${release_dir}"
              unzip -q \
                "${release_tmp}/${WEB_ASSET_NAME}" \
                -d "${release_dir}"
            else
              echo "No web build stored for ${release_version}; skipping."
            fi
          done < <(
            gh api --paginate "${releases_api}" \
              --jq '.[] | select(.draft == false) | .tag_name'
          )

          test -f \
            "pages-store/releases/${RELEASE_VERSION}/index.html"

      - name: Add latest and root redirects
        shell: bash
        run: |
          set -euo pipefail
          touch pages-store/.nojekyll
          mkdir -p pages-store/latest
          cat > pages-store/latest/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh"
                content="0; url=../releases/${RELEASE_VERSION}/">
              <title>Babylon Walking Mobile</title>
            </head>
            <body>
              <a href="../releases/${RELEASE_VERSION}/">
                Open the latest release
              </a>
            </body>
          </html>
          HTML
          cat > pages-store/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./latest/">
              <title>Babylon Walking Mobile</title>
            </head>
            <body>
              <a href="./latest/">Open the latest release</a>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-store

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
